<!DOCTYPE html>
<html lang="es-MX" data-tema="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La colección · AV Watches</title>
<meta name="description" content="Las doce piezas de AV Watches: buceo, cronógrafos, GMT, esqueletos y vestir. Filtra por colección, metal, tamaño y precio.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0C'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23C9A24A' text-anchor='middle'%3EAV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/paginas.css">
<script src="assets/js/datos.js" defer></script>
<script src="assets/js/motor-reloj.js" defer></script>
<script src="assets/js/tienda.js" defer></script>
<script src="assets/js/componentes.js" defer></script>
<script src="assets/js/catalogo.js" defer></script>
</head>
<body>
<main id="principal">
  <section class="av-seccion av-marco" style="padding-bottom:0">
    <header class="av-catalogo__cab">
      <div>
        <p class="av-t-eyebrow" style="margin-bottom:.8rem">La colección completa</p>
        <h1 class="av-t-display">Doce piezas<br>y ninguna de relleno.</h1>
      </div>
      <div style="text-align:right">
        <p class="av-conteo" id="conteo">12 piezas</p>
        <div class="av-orden" style="margin-top:.6rem;justify-content:flex-end">
          <label for="orden">Ordenar</label>
          <select id="orden">
            <option value="destacado">De la casa</option>
            <option value="precio-asc">Precio · menor a mayor</option>
            <option value="precio-desc">Precio · mayor a menor</option>
            <option value="nuevo">Lo más nuevo</option>
            <option value="tamano">Tamaño de caja</option>
            <option value="raro">Los más escasos</option>
          </select>
        </div>
      </div>
    </header>

    <div class="av-catalogo">
      <form class="av-filtros" id="filtros" aria-label="Filtrar la colección">
        <div class="av-filtro"><h3>Colección</h3><div id="f-coleccion"></div></div>
        <div class="av-filtro"><h3>Temperamento</h3><div id="f-estilo"></div></div>
        <div class="av-filtro"><h3>Material de caja</h3><div id="f-metal"></div></div>
        <div class="av-filtro"><h3>Complicación</h3><div id="f-comp"></div></div>
        <div class="av-filtro">
          <h3>Hasta cuánto</h3>
          <div class="av-rango">
            <input type="range" id="f-precio" min="20000" max="100000" step="1000" value="100000" aria-label="Precio máximo">
            <div class="av-rango__val"><span>$20,000</span><span id="f-precio-val">Sin tope</span></div>
          </div>
        </div>
        <div class="av-filtro">
          <h3>Diámetro máximo</h3>
          <div class="av-rango">
            <input type="range" id="f-diam" min="36" max="43" step="1" value="43" aria-label="Diámetro máximo de caja">
            <div class="av-rango__val"><span>36 mm</span><span id="f-diam-val">43 mm</span></div>
          </div>
        </div>
        <button type="button" class="av-btn av-btn--bajo" id="f-limpiar">Limpiar filtros</button>
      </form>

      <div class="av-vitrina" id="vitrina" style="align-content:start"></div>
    </div>
  </section>
</main>
</body>
</html>
