<!DOCTYPE html>
<html lang="es-MX" data-tema="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo · AV Watches</title>
<meta name="description" content="Relojes nuevos y seminuevos de Seiko, Tissot, Hamilton, Oris, Omega y más. Filtra por marca, condición, precio y tamaño.">
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23C0392B'/%3E%3Ctext x='16' y='23' font-family='Archivo,Helvetica,Arial,sans-serif' font-size='18' font-weight='900' letter-spacing='-1' fill='%23FFFFFF' text-anchor='middle'%3EAV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/paginas.css">
<script src="assets/js/datos.js" defer></script>
<script src="assets/js/motor-reloj.js" defer></script>
<script src="assets/js/perfil.js" defer></script>
<script src="assets/js/tienda.js" defer></script>
<script src="assets/js/escala.js" defer></script>
<script src="assets/js/mecanismo.js" defer></script>
<script src="assets/js/componentes.js" defer></script>
<script src="assets/js/catalogo.js" defer></script>
</head>
<body>
<main id="principal">
  <section class="av-seccion av-marco" style="padding-bottom:0">
    <header class="av-catalogo__cab" data-revelar>
      <div>
        <p class="av-t-eyebrow" style="margin-bottom:.8rem">Todo lo que tengo</p>
        <h1 class="av-t-display">Nada que yo<br>no me pondría.</h1>
      </div>
      <div style="text-align:right">
        <p class="av-conteo" id="conteo">13 relojes</p>
        <div class="av-orden" style="margin-top:.6rem;justify-content:flex-end">
          <label for="orden">Ordenar</label>
          <select id="orden">
            <option value="destacado">De la casa</option>
            <option value="precio-asc">Precio · menor a mayor</option>
            <option value="precio-desc">Precio · mayor a menor</option>
            <option value="nuevo">Lo más nuevo</option>
            <option value="tamano">Tamaño de caja</option>
            <option value="stock">Los que quedan menos</option>
          </select>
        </div>
      </div>
    </header>

    <div class="av-catalogo">
      <button type="button" class="av-filtros-abrir" id="filtros-abrir" aria-expanded="false" aria-controls="filtros">
        <span>Filtrar y ordenar</span><b id="filtros-cuenta"></b>
      </button>
      <form class="av-filtros" id="filtros" aria-label="Filtrar la colección">
        <div class="av-filtros__cabeza">
          <span class="av-t-eyebrow">Filtros</span>
          <button type="button" class="av-cerrar" id="filtros-cerrar">Listo</button>
        </div>
        <div class="av-filtro"><h3>Marca</h3><div id="f-marca"></div></div>
        <div class="av-filtro"><h3>Condición</h3><div id="f-condicion"></div></div>
        <div class="av-filtro"><h3>Para qué</h3><div id="f-coleccion"></div></div>
        <div class="av-filtro"><h3>Mecánica</h3><div id="f-mecanica"></div></div>
        <div class="av-filtro"><h3>Tipo</h3><div id="f-estilo"></div></div>
        <div class="av-filtro"><h3>Complicación</h3><div id="f-comp"></div></div>
        <div class="av-filtro">
          <h3>Hasta cuánto</h3>
          <div class="av-rango">
            <input type="range" id="f-precio" min="1500" max="160000" step="500" value="160000" aria-label="Precio máximo">
            <div class="av-rango__val"><span>$1,500</span><span id="f-precio-val">Sin tope</span></div>
          </div>
        </div>
        <div class="av-filtro">
          <h3>Diámetro máximo</h3>
          <div class="av-rango">
            <input type="range" id="f-diam" min="34" max="45" step="0.5" value="45" aria-label="Diámetro máximo de caja">
            <div class="av-rango__val"><span>34 mm</span><span id="f-diam-val">45 mm</span></div>
          </div>
        </div>
        <button type="button" class="av-btn av-btn--bajo" id="f-limpiar">Limpiar filtros</button>
      </form>

      <div class="av-vitrina" id="vitrina" style="align-content:start"></div>
    </div>
  </section>
</main>
</body>
</html>
